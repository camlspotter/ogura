[project]
name = "ogura-textrec"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=25.0.1",
    "fonttools>=4.55",
    "numpy>=2",
    "Pillow==12.3.0",
    "torch>=2.6,<3",
    "PyMuPDF==1.28.2",
]

[project.optional-dependencies]
# Compatibility for existing training commands.
train = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ogura.textrec", "ogura.textrec.training"]
include-package-data = false

[tool.setuptools.package-data]
"ogura.textrec" = ["training_fonts.json"]
