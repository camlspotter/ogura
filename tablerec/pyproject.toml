[project]
name = "ogura-tablerec"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.55",
    "numpy>=2",
    "Pillow==12.3.0",
    "torch>=2.6,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ogura.tablerec"]
include-package-data = false
